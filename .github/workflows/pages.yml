name: Deploy to GitHub Pages

# Publishes the repository root, so https://<user>.github.io/skyward/ serves
# index.html and the levels/*.json files beside it (the game fetches those
# live when it is served over HTTP).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages has to be switched on once by hand (Settings > Pages > Source:
      # GitHub Actions). The default Actions token is not allowed to create
      # the Pages site itself, so this step only reads the existing config.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
